<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MonCouteauSuisse — Outils gratuits</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #101426;
      color: #eef1ff;
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    header, main, footer {
      max-width: 700px;
      margin: auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 28px;
      color: #82b1ff;
      overflow-wrap: anywhere;
    }

    h2 {
      margin-top: 0;
      font-size: 22px;
    }

    header p, footer {
      color: #b7bfd9;
    }

    section {
      margin-bottom: 20px;
      padding: 22px;
      background: #1b223b;
      border: 1px solid #354063;
      border-radius: 18px;
    }

    label {
      display: block;
      margin: 12px 0 6px;
    }

    input, textarea, button {
      width: 100%;
      padding: 13px;
      font: inherit;
      border-radius: 10px;
    }

    input, textarea {
      background: #101426;
      color: white;
      border: 1px solid #536084;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }
