<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MonCouteauSuisse — Boîte à outils du quotidien</title>
<style>
:root{--bg:#0f1220;--card:#181c2e;--card2:#202641;--text:#eef1ff;--muted:#a8b0d0;--accent:#6c8cff;--accent2:#22d3ee}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;background:linear-gradient(160deg,#0f1220,#131a33 60%,#101528);color:var(--text);min-height:100vh}
header{padding:28px 20px 10px;text-align:center}
.logo{font-size:30px;font-weight:800;letter-spacing:-.5px}
.logo span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
p.tag{color:var(--muted);margin:8px auto 0;max-width:640px}
.searchwrap{max-width:720px;margin:22px auto 0;padding:0 16px}
#search{width:100%;padding:15px 18px;border-radius:16px;border:1px solid #2b3357;background:var(--card);color:var(--text);font-size:16px;outline:none}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(108,140,255,.15)}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:18px}
button.tab{padding:10px 14px;border-radius:999px;border:1px solid #2b3357;background:var(--card);color:var(--muted);cursor:pointer;font-size:14px}
button.tab.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#081018;border-color:transparent;font-weight:700}
main{max-width:1050px;margin:0 auto;padding:8px 16px 50px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid #262d4d;border-radius:18px;padding:18px}
.card h2{margin:0 0 4px;font-size:19px}
.card p.desc{color:var(--muted);font-size:14px;margin:0 0 14px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:11px;border:1px solid #2b3357;background:var(--card2);color:var(--text);font-size:15px}
textarea{min-height:110px;resize:vertical}
button.act{margin-top:12px;width:100%;padding:12px;border:0;border-radius:12px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#081018;font-weight:800;font-size:15px;cursor:pointer}
button.ghost{background:transparent;border:1px solid #2b3357;color:var(--muted);font-weight:600}
.result{margin-top:12px;padding:12px;border-radius:12px;background:#101528;border:1px solid #2b3357;font-size:15px;word-break:break-word}
.row{display:flex;gap:10px}.row>*{flex:1}
footer{text-align:center;color:var(--muted);font-size:13px;padding:24px}
.badge{display:inline-block;font-size:12px;color:var(--accent2);border:1px solid #2b3357;padding:3px 8px;border-radius:999px;margin-bottom:10px}
</style>
</head>
<body>
<header>
<div class="logo">Mon<span>CouteauSuisse</span></div>
<p class="tag">Des outils simples pour les études, les fichiers, les calculs et la vie quotidienne — sans inscription.</p>
</header>
<div class="searchwrap"><input id="search" placeholder="Rechercher un outil : moyenne, PDF, mot de passe, devises…"></div>
<nav id="tabs"></nav>
<main><div id="tools" class="grid"></div></main>
<footer>Version 1 — fonctionne hors ligne dans ton navigateur. Tes données restent sur ton appareil.</footer>
<script>
const tools=[
{id:'moyenne',cat:'Études',title:'Calculatrice de moyenne',desc:'Calcule ta moyenne pondérée avec coefficients.',html:'<label>Notes et coefficients</label><textarea id="mIn" placeholder="Exemple :\n14 2\n16 1\n11 3"></textarea><button class="act" onclick="moy()">Calculer</button><div id="mOut" class="result hidden"></div>',js:'function moy(){const lines=document.getElementById("mIn").value.trim().split(/\n+/);let s=0,c=0;for(const l of lines){const p=l.trim().split(/[\s,;]+/);if(p.length<2)continue;const n=parseFloat(p[0].replace(",",".")),k=parseFloat(p[1].replace(",","."));if(isFinite(n)&&isFinite(k)){s+=n*k;c+=k}}const o=document.getElementById("mOut");if(!c){o.className="result";o.textContent="Entre au moins une note et son coefficient.";return}o.className="result";o.textContent="Moyenne pondérée : "+(s/c).toFixed(2)+" / 20"}'},
{id:'pourcentage',cat:'Calculs',title:'Pourcentage',desc:'Calcule un pourcentage, une remise ou une augmentation.',html:'<label>Valeur</label><input id="pVal" type="number" placeholder="80"><label>Pourcentage</label><input id="pPct" type="number" placeholder="25"><button class="act" onclick="pct()">Calculer</button><div id="pOut" class="result hidden"></div>',js:'function pct(){const v=parseFloat(document.getElementById("pVal").value),p=parseFloat(document.getElementById("pPct").value),o=document.getElementById("pOut");if(!isFinite(v)||!isFinite(p)){o.className="result";o.textContent="Entre deux nombres.";return}const r=v*p/100;o.className="result";o.innerHTML=p+"% de "+v+" = <b>"+r+"</b><br>"+v+" + "+p+"% = <b>"+(v+r)+"</b><br>"+v+" − "+p+"% = <b>"+(v-r)+"</b>"}'},
{id:'tva',cat:'Calculs',title:'TVA et prix TTC',desc:'Passe d’un prix HT à TTC, ou l’inverse.',html:'<label>Prix</label><input id="tVal" type="number" placeholder="100"><label>Taux de TVA (%)</label><input id="tRate" type="number" value="20"><button class="act" onclick="tva()">Calculer</button><div id="tOut" class="result hidden"></div>',js:'function tva(){const v=parseFloat(document.getElementById("tVal").value),r=parseFloat(document.getElementById("tRate").value)/100,o=document.getElementById("tOut");if(!isFinite(v)||!isFinite(r)){o.className="result";o.textContent="Entre un prix et un taux.";return}o.className="result";o.innerHTML="HT → TTC : <b>"+(v*(1+r)).toFixed(2)+" €</b><br>TTC → HT : <b>"+(v/(1+r)).toFixed(2)+" €</b><br>Montant de TVA : <b>"+(v*r).toFixed(2)+" €</b>"}'},
{id:'unites',cat:'Calculs',title:'Convertisseur d’unités',desc:'Longueurs, masses et volumes.',html:'<label>Valeur</label><input id="uVal" type="number" value="1"><div class="row"><div><label>De</label><select id="uFrom"></select></div><div><label>Vers</label><select id="uTo"></select></div></div><button class="act" onclick="unit()">Convertir</button><div id="uOut" class="result hidden"></div>',js:'const U={"km":1000,"m":1,"cm":.01,"mm":.001,"kg":1,"g":.001,"t":1000,"L":1,"mL":.001};function fillU(){const opts=Object.keys(U).map(k=>"<option>"+k+"</option>").join("");document.getElementById("uFrom").innerHTML=opts;document.getElementById("uTo").innerHTML=opts;document.getElementById("uFrom").value="m";document.getElementById("uTo").value="km"}fillU();function unit(){const v=parseFloat(document.getElementById("uVal").value),f=document.getElementById("uFrom").value,t=document.getElementById("uTo").value,o=document.getElementById("uOut");if(!isFinite(v)){o.className="result";o.textContent="Entre une valeur.";return}let r;if(["km","m","cm","mm"].includes(f)&&["km","m","cm","mm"].includes(t))r=v*U[f]/U[t];else if(["kg","g","t"].includes(f)&&["kg","g","t"].includes(t))r=v*U[f]/U[t];else if(["L","mL"].includes(f)&&["L","mL"].includes(t))r=v*U[f]/U[t];else{o.className="result";o.textContent="Choisis deux unités de la même catégorie.";return}o.className="result";o.textContent=v+" "+f+" = "+r+" "+t}'},
{id:'mdp',cat:'Sécurité',title:'Générateur de mot de passe',desc:'Crée un mot de passe solide, généré localement.',html:'<label>Longueur</label><input id="pwLen" type="number" value="16" min="8" max="64"><label><input type="checkbox" id="pwSym" checked> Inclure symboles</label><button class="act" onclick="gen()">Générer</button><div id="pwOut" class="result hidden"></div>',js:'function gen(){const n=Math.min(64,Math.max(8,parseInt(document.getElementById("pwLen").value)||16));let chars="ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";if(document.getElementById("pwSym").checked)chars+="!@#$%^&*()-_=+[]{};:,.?";let out="";const arr=new Uint32Array(n);crypto.getRandomValues(arr);for(let i=0;i<n;i++)out+=chars[arr[i]%chars.length];const o=document.getElementById("pwOut");o.className="result";o.innerHTML="<b>"+out+"</b>"}'},
{id:'mots',cat:'Texte',title:'Compteur de mots',desc:'Compte mots, caractères, phrases et temps de lecture.',html:'<label>Ton texte</label><textarea id="wIn" placeholder="Colle ton texte ici…"></textarea><button class="act" onclick="count()">Analyser</button><div id="wOut" class="result hidden"></div>',js:'function count(){const t=document.getElementById("wIn").value.trim(),o=document.getElementById("wOut");const words=t?t.split(/\s+/).length:0,chars=t.length,sent=t?t.split(/[.!?]+/).filter(x=>x.trim()).length:0;o.className="result";o.innerHTML="Mots : <b>"+words+"</b> • Caractères : <b>"+chars+"</b> • Phrases : <b>"+sent+"</b><br>Temps de lecture estimé : <b>"+Math.max(1,Math.ceil(words/200))+" min</b>"}'},
{id:'pomodoro',cat:'Productivité',title:'Minuteur Pomodoro',desc:'25 minutes de travail, puis 5 minutes de pause.',html:'<div class="result" id="pomoTime" style="font-size:34px;text-align:center;font-weight:800">25:00</div><button class="act" onclick="startPomo()">Démarrer</button><button class="act ghost" onclick="resetPomo()">Réinitialiser</button>',js:'let pomoLeft=25*60,pomoTimer=null;function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}function tick(){pomoLeft--;document.getElementById("pomoTime").textContent=fmt(Math.max(0,pomoLeft));if(pomoLeft<=0){clearInterval(pomoTimer);pomoTimer=null;document.getElementById("pomoTime").textContent="Pause !";alert("Session terminée. Prends 5 minutes de pause.")}}function startPomo(){if(pomoTimer)return;pomoTimer=setInterval(tick,1000)}function resetPomo(){clearInterval(pomoTimer);pomoTimer=null;pomoLeft=25*60;document.getElementById("pomoTime").textContent="25:00"}'},
{id:'todo',cat:'Productivité',title:'Liste de tâches',desc:'Ajoute, coche et supprime tes tâches. Sauvegarde locale.',html:'<div class="row"><input id="todoIn" placeholder="Nouvelle tâche"><button class="act" style="width:auto;padding:11px 16px" onclick="addTodo()">Ajouter</button></div><div id="todoList" style="margin-top:12px"></div>',js:'function loadTodos(){return JSON.parse(localStorage.getItem("mcs_todos")||"[]")}function saveTodos(a){localStorage.setItem("mcs_todos",JSON.stringify(a))}function renderTodos(){const a=loadTodos(),el=document.getElementById("todoList");el.innerHTML=a.length?"":'<div class="result">Aucune tâche pour l’instant.</div>';a.forEach((t,i)=>{const d=document.createElement("div");d.className="result";d.style.display="flex";d.style.alignItems="center";d.style.gap="10px";d.innerHTML='<input type="checkbox" '+(t.done?"checked":"")+' onchange="toggleTodo('+i+')"><span style="flex:1;'+(t.done?"text-decoration:line-through;opacity:.6":"")+'">'+t.text+'</span><button class="act ghost" style="width:auto;margin:0;padding:6px 10px" onclick="delTodo('+i+')">✕</button>';el.appendChild(d)})}function addTodo(){const i=document.getElementById("todoIn"),v=i.value.trim();if(!v)return;const a=loadTodos();a.push({text:v,done:false});saveTodos(a);i.value="";renderTodos()}function toggleTodo(i){const a=loadTodos();a[i].done=!a[i].done;saveTodos(a);renderTodos()}function delTodo(i){const a=loadTodos();a.splice(i,1);saveTodos(a);renderTodos()}renderTodos()'},
{id:'imc',cat:'Santé',title:'Calculateur d’IMC',desc:'Indice de masse corporelle, à titre indicatif.',html:'<div class="row"><div><label>Taille (cm)</label><input id="h" type="number" placeholder="175"></div><div><label>Poids (kg)</label><input id="w" type="number" placeholder="70"></div></div><button class="act" onclick="imc()">Calculer</button><div id="bmiOut" class="result hidden"></div>',js:'function imc(){const h=parseFloat(document.getElementById("h").value)/100,w=parseFloat(document.getElementById("w").value),o=document.getElementById("bmiOut");if(!h||!w){o.className="result";o.textContent="Entre ta taille et ton poids.";return}const b=w/(h*h);let cat=b<18.5?"insuffisance pondérale":b<25?"corpulence normale":b<30?"surpoids":"obésité";o.className="result";o.innerHTML="IMC : <b>"+b.toFixed(1)+"</b> — "+cat+".<br><small>Cet indicateur ne remplace pas un avis médical.</small>"}'},
{id:'date',cat:'Vie pratique',title:'Calcul de dates',desc:'Ajoute des jours à une date.',html:'<label>Date de départ</label><input id="d1" type="date"><label>Ajouter des jours</label><input id="days" type="number" value="30"><button class="act" onclick="addDays()">Calculer</button><div id="dateOut" class="result hidden"></div>',js:'function addDays(){const d=document.getElementById("d1").value,n=parseInt(document.getElementById("days").value)||0,o=document.getElementById("dateOut");if(!d){o.className="result";o.textContent="Choisis une date.";return}const dt=new Date(d);dt.setDate(dt.getDate()+n);o.className="result";o.textContent=dt.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}'}
];
const cats=["Tous","Études","Calculs","Texte","Sécurité","Productivité","Santé","Vie pratique"];
let active="Tous",query="";
const tabsEl=document.getElementById("tabs"),grid=document.getElementById("tools");
cats.forEach(c=>{const b=document.createElement("button");b.className="tab"+(c===active?" active":"");b.textContent=c;b.onclick=()=>{active=c;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()};tabsEl.appendChild(b)});
document.getElementById("search").addEventListener("input",e=>{query=e.target.value.toLowerCase();render()});
function render(){grid.innerHTML="";tools.filter(t=>(active==="Tous"||t.cat===active)&&(t.title.toLowerCase().includes(query)||t.desc.toLowerCase().includes(query)||t.cat.toLowerCase().includes(query))).forEach(t=>{const c=document.createElement("div");c.className="card";c.innerHTML='<div class="badge">'+t.cat+'</div><h2>'+t.title+'</h2><p class="desc">'+t.desc+'</p>'+t.html;grid.appendChild(c);if(t.js)(new Function(t.js))()})}
render();
</script>
</body>
</html>
